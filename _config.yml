title: Notes
description: 개발과 보안을 배우며 기록하는 블로그
url: https://vrynmn.github.io
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: Vryn
github_url: https://github.com/VrynMN
markdown: kramdown
highlighter: rouge
