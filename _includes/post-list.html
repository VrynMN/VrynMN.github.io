<ul class="post-list">
{% for post in include.posts %}
<li><article class="post-row"><div class="post-info"><h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>{% if post.categories.size > 0 %}<span class="post-category">{{ post.categories | join: ' / ' | escape }}</span>{% endif %}</div><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time></article></li>
{% else %}<li class="empty">첫 번째 기록을 준비하고 있어요.</li>{% endfor %}
</ul>
