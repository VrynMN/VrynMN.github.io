shell<a class="home" href="{{ '/home/' | relative_url }}">Home</a><!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/img/folder.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<div class="shell">
<header class="header"><a class="home" href="{{ '/home/' | relative_url }}">
  <img
    class="home-icon"
    src="{{ '/assets/img/home-icon.png' | relative_url }}"
    alt=""
    width="22"
    height="22"
  >
  <span>Home</span>
</a><nav aria-label="주 메뉴"><a href="{{ '/posts/' | relative_url }}">Posts</a><a href="{{ '/about/' | relative_url }}">About</a></nav></header>
<main id="main">{{ content }}</main>
<footer class="footer">© {{ 'now' | date: '%Y' }} <a href="{{ site.github_url | escape }}">{{ site.author | escape }}</a></footer>
</div></body></html>
