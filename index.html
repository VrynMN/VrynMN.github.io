---
layout: null
permalink: /
---
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title | escape }}</title>
<meta name="description" content="{{ site.description | escape }}">
<link rel="canonical" href="{{ '/' | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/img/folder.png' | relative_url }}">
<style>
*{box-sizing:border-box}html{background:#fff;color:#000;color-scheme:light}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}main{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:40px 24px}.welcome{width:max-content;max-width:100%;padding-bottom:28px}.greeting{display:flex;align-items:center;gap:18px}h1{margin:0;font-size:48px;line-height:1.15;letter-spacing:-1.8px;font-weight:750}.mascot{width:72px;height:72px;object-fit:contain;flex-shrink:0}.subtitle{font-size:21px;line-height:1.6;margin:14px 0 0}.enter{display:inline-flex;align-items:center;gap:10px;margin-top:38px;padding:10px 0;color:#777;font-size:13px;line-height:1.5;text-decoration:none;letter-spacing:.4px}.arrow{display:inline-block;transition:transform .18s ease}.enter:hover{color:#000}.enter:hover .arrow{transform:translateX(4px)}.enter:focus-visible{outline:2px solid #000;outline-offset:6px;border-radius:2px}@media(max-width:480px){h1{font-size:38px;letter-spacing:-1.3px}.mascot{width:58px;height:58px}.greeting{gap:14px}.subtitle{font-size:18px}.enter{margin-top:30px}}@media(prefers-reduced-motion:reduce){.arrow{transition:none}.enter:hover .arrow{transform:none}}
</style>
</head>
<body>
<main><section class="welcome" aria-labelledby="hello"><div class="greeting"><h1 id="hello">Hi there</h1><img class="mascot" src="{{ '/assets/img/folder.png' | relative_url }}" alt="웃는 하늘색 폴더 캐릭터" width="72" height="72"></div><p class="subtitle">Welcome to my blog</p><a class="enter" href="{{ '/home/' | relative_url }}" aria-label="블로그 홈으로 들어가기">Enter <span class="arrow" aria-hidden="true">→</span></a></section></main>
</body>
</html>
