---
layout: default
---
<section class="intro" aria-labelledby="hello"><div class="greeting"><h1 id="hello">Hi there</h1><img class="mascot" src="{{ '/assets/img/folder.png' | relative_url }}" alt="웃는 하늘색 폴더 캐릭터" width="64" height="64"></div><p>Welcome to my blog</p></section>
<section class="categories" aria-labelledby="categories"><h2 id="categories">Categories</h2><ul class="category-grid">{% for category in site.data.categories %}<li><a href="{{ '/categories/' | append: category.slug | append: '/' | relative_url }}">{{ category.name | escape }}</a></li>{% endfor %}</ul></section>
<section class="recent" aria-labelledby="recent"><div class="section-heading"><h2 id="recent">Recent posts</h2><a href="{{ '/posts/' | relative_url }}">View all →</a></div>{% assign recent_posts = site.posts | slice: 0, 5 %}{% include post-list.html posts=recent_posts %}</section>
